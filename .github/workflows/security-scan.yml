name: Security scan
# Secrets in the whole git history (Gitleaks, .gitleaks.toml) and workflow misconfiguration (zizmor). Both tools are
# pinned: Gitleaks by version and the SHA-256 of its release archive, zizmor by PyPI version.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history, so a secret in an old commit is found
          persist-credentials: false
      - name: Secrets (Gitleaks 8.30.1)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Workflows (zizmor 1.31.1)
        # Informational notes (the release version expansion) don't fail the build.
        run: pipx run zizmor==1.31.1 --offline --min-severity low .github/workflows
