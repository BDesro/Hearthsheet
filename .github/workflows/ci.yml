name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: A pull request into main must be newer than the latest release
        if: github.base_ref == 'main'
        shell: pwsh
        run: ./scripts/check-version.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Hearthsheet.slnx -c Release
      - run: dotnet test Hearthsheet.slnx -c Release --no-build
      # Publishing runs the trimmer, which a plain build doesn't. Never deployed from here (spec 13).
      - run: dotnet publish src/Hearthsheet.Web -c Release -o artifacts/web
