name: Release
# Runs when a pull request is merged into main (a merge is a push to main). The version in Directory.Build.props
# decides the release: if it is newer than the latest release tag, the workflow tests, packages and publishes a release
# that creates tag v<version> on the merge commit. Otherwise (a merge that didn't bump the version) it does nothing.
# Uses the workflow's own GITHUB_TOKEN, no PAT. The release notes shown in the app's update dialog are RELEASE_NOTES.md:
# plain text, rewritten for each release.
# After a release, deploy-web publishes Hearthsheet.Web to the Cloudflare Pages project "hearthsheet" (docs/WEB.md).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version and check that it is newer than the latest release
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          ./scripts/check-version.ps1
          $new = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $new) { Write-Host "::warning::No release published: v$version is not newer than the latest release." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "new=$($new.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.new == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Test
        if: steps.version.outputs.new == 'true'
        run: dotnet test Hearthsheet.slnx -c Release
      - name: Install Inno Setup if the runner lacks it
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Create release
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          gh release create $tag (Get-Item artifacts/*.zip).FullName artifacts/Hearthsheet-Setup.exe artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Hearthsheet $tag" --notes-file RELEASE_NOTES.md

  # Spec 12/13: only after a new release on main (this workflow never runs for PRs, forks or dev). Cloudflare's own Git
  # integration is not used. The token has only "Cloudflare Pages: Edit"; wrangler is pinned to an exact version.
  # The token lives in the "production" environment, whose deployment branches are limited to main, so no other
  # branch's workflow can read it.
  deploy-web:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Publish the web app
        run: dotnet publish src/Hearthsheet.Web -c Release -o web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.150.0 pages deploy web/wwwroot --project-name=hearthsheet --branch=main
